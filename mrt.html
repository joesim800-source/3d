<!DOCTYPE html>

<title>沿线公寓比价 · Rail Corridor</title>
<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(217,183,114,.0),0 2px 8px #0003}50%{box-shadow:0 0 0 7px rgba(217,183,114,.35),0 2px 8px #0003}}

#card{position:fixed;left:10px;right:10px;top:calc(env(safe-area-inset-top) + 10px);max-width:560px;margin:0 auto;background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-radius:16px;border:1px solid rgba(176,138,79,.35);box-shadow:0 6px 24px #0002;padding:10px 12px 9px;z-index:10}

button,.btn{font:700 13px var(--sans);border-radius:10px;border:1px solid #d8d2c6;background:#fff;color:var(--ink);padding:7px 11px;cursor:pointer}
button:active{transform:scale(.95)}
button.pri{background:var(--g);border-color:var(--g);color:#fff}

.seg{display:inline-flex;border:1px solid #d8d2c6;border-radius:10px;overflow:hidden}

.seg button.on{background:var(--g);color:#fff}
.d3o{display:none}body.d3 #tools .d3o{display:block}#mt .g3b{color:#1d4ed8;font-weight:800}
#g3Box{position:fixed;inset:0;z-index:200;background:#000}#g3Box gmp-map-3d{position:absolute;inset:0;width:100%;height:100%}
#g3Box .g3bar{position:absolute;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));display:flex;gap:8px;z-index:2;flex-wrap:wrap;justify-content:center;width:max-content;max-width:96vw}
#g3Box .g3bar button,#g3Box .g3x{background:#fff;border:0;border-radius:14px;padding:10px 14px;font-size:15px;font-weight:800;box-shadow:0 3px 12px #0005;color:#0f2e25}
#g3Box .g3x{position:absolute;top:max(12px,env(safe-area-inset-top));right:12px;z-index:2;font-size:16px}

.rgs{display:flex;gap:6px;flex-wrap:wrap}.rgs button{padding:7px 11px;border-radius:999px;font-size:13px}.rgs button.on{background:#0D4A38;color:#fff;border-color:#0D4A38}
.lk{font-size:12px;font-weight:800;color:#6b5a3a;margin:10px 0 4px;letter-spacing:.06em}.lcs{display:flex;flex-wrap:wrap;gap:6px}
.lc{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;border:2px solid var(--c)!important;background:#fff;font-weight:700;font-size:13px}.lc i{width:12px;height:12px;border-radius:50%;background:var(--c)}.lc.on{background:var(--c);color:#fff}.lc.on i{background:#fff}
.lnp{position:absolute;left:0;top:0;background:var(--c);color:#fff;font-size:11px;font-weight:800;padding:3px 8px;border-radius:999px;border:2px solid #fff;box-shadow:0 2px 6px #0004;white-space:nowrap;cursor:pointer;pointer-events:auto}
#lnPick{position:fixed;left:50%;bottom:110px;transform:translate(-50%,20px);opacity:0;pointer-events:none;transition:.2s;z-index:30;background:#fff;border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 24px #0004;border:3px solid var(--c);max-width:94vw}
#lnPick.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}#lnPick i{width:14px;height:14px;border-radius:50%;background:var(--c);flex:none}#lnPick b{font-size:14px;white-space:nowrap}#lnPick button{background:var(--c);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-weight:800;white-space:nowrap}

.sc.ov{background:var(--g)}.sc.ov b,.sc.ov small{color:#fff}
#sheet{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 70px);z-index:20;max-width:640px;margin:0 auto;background:var(--paper);border-radius:18px;box-shadow:0 -8px 30px #0003;max-height:calc(100vh - 230px);display:flex;flex-direction:column;transform:translateY(calc(100% + 90px));transition:transform .25s ease}

.big{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 10px}

.li{display:flex;align-items:center;gap:8px;padding:9px 4px;border-bottom:1px solid #eee6d8;cursor:pointer}

.li .nm{flex:1;min-width:0}.li .nm b{display:block;font:800 14px var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.li .pv{text-align:right;font:800 13px var(--sans)}.li .pv small{display:block;font:600 11px var(--sans);color:#6b756f}

.fm{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;margin:8px 0}

details{border:1px solid #eee6d8;border-radius:12px;background:#fff;padding:6px 10px;margin:8px 0}
details summary{font:800 13.5px var(--sans);cursor:pointer;padding:4px 0;color:var(--g)}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 130px);transform:translateX(-50%);background:#101b17e6;color:#fff;font:700 13px var(--sans);padding:8px 14px;border-radius:12px;z-index:40;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#attr{position:fixed;left:8px;bottom:calc(env(safe-area-inset-bottom) + 74px);font:500 9.5px var(--sans);color:#333;background:#fff9;padding:1px 5px;border-radius:5px;z-index:8;pointer-events:none}
#busy{position:fixed;inset:0;background:#fff6;z-index:50;display:none;align-items:center;justify-content:center;font:800 15px var(--sans);color:var(--g)}
#busy.show{display:flex}
canvas.chart{width:100%;display:block;background:#fff;border-radius:12px;border:1px solid #eee6d8}
.tag{display:inline-block;font:700 10.5px var(--sans);padding:1px 6px;border-radius:6px;background:#efe9dd;color:var(--gold2);margin-right:4px}
.lm{position:absolute;left:0;top:0;pointer-events:auto;cursor:pointer;display:flex;align-items:center;gap:4px;height:30px;min-width:30px;padding:0 6px 0 4px;border-radius:15px;background:rgba(255,255,255,.95);border:1.5px solid #B08A4F;box-shadow:0 2px 6px #0003;white-space:nowrap}
.lm span{font-size:17px;line-height:1;width:20px;text-align:center}.lm em{font:700 11.5px var(--sans);font-style:normal;color:#123449}.lm:not(.full){padding:0 4px;justify-content:center}
#car{position:absolute;left:0;top:0;width:38px;height:38px;display:none;pointer-events:none;filter:drop-shadow(0 2px 4px #0005)}#car svg{width:38px;height:38px;transition:transform .08s linear}
.rtag{position:absolute;left:0;top:0;white-space:nowrap;pointer-events:none;background:#fff;border:2px solid #0D4A38;border-radius:9px;padding:3px 9px;font:800 12.5px var(--sans);color:#0D4A38;box-shadow:0 2px 8px #0003}
#rtB{border-color:#dc2626;color:#991b1b}
#rbar{position:fixed;left:8px;right:8px;max-width:640px;margin:0 auto;bottom:calc(env(safe-area-inset-bottom) + 10px);z-index:22;background:#0D4A38;color:#fff;border-radius:14px;padding:9px 10px 9px 14px;display:none;align-items:center;gap:8px;box-shadow:0 6px 20px #0004}
#rbar.show{display:flex}#rbar .tx{flex:1;min-width:0}#rbar b{display:block;font:800 13.5px var(--sans)}#rbar small{display:block;font:600 11.5px var(--sans);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rbar button{background:#ffffff22;border-color:#ffffff44;color:#fff;padding:7px 11px}
body.routing .cd,body.routing .lm,body.routing #strip{display:none!important}
</style>
</head>
<body>
<div id="map"><canvas id="glc"></canvas><canvas id="cv"></canvas><div id="labs"></div><div id="car"><svg viewBox="0 0 38 38"></svg></div><div class="rtag" id="rtA" style="display:none"></div><div class="rtag" id="rtB" style="display:none"></div></div>
<div id="rbar"><div class="tx"><b id="rbT"></b><small id="rbS"></small></div><button id="rbP">⏸</button><button id="rbR">↺</button><button id="rbX">✕</button></div>

  <div class="kick" id="kick">RAIL CORRIDOR · 500 M COLLECTION</div>

<input type="file" id="fileIn" accept=".csv,text/csv,text/plain" style="display:none">
<script>
'use strict';
/* ========== 小工具 ========== */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){toast('⚠ 储存空间满了');}}};
let TT=0;function toast(s,ms){const t=$('toast');t.textContent=s;t.classList.add('show');clearTimeout(TT);TT=setTimeout(()=>t.classList.remove('show'),ms||2600);}
function busy(on,txt){$('busy').classList.toggle('show',!!on);if(txt)$('busyT').textContent=txt;}
const R2=Math.PI/180;
function hav(a,b,c,d){const R=6371000,x=(c-a)*R2,y=(d-b)*R2,s=Math.sin(x/2)**2+Math.cos(a*R2)*Math.cos(c*R2)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(s));}
const walkMin=m=>Math.max(2,Math.round(m*1.3/78));
const med=a=>{const v=a.filter(x=>x>0).sort((p,q)=>p-q);if(!v.length)return 0;const m=v.length>>1;return v.length%2?v[m]:(v[m-1]+v[m])/2;};
const fmtRM=v=>!v?'—':v>=1e6?'RM'+(v/1e6).toFixed(2)+'M':'RM'+Math.round(v/1000)+'k';
const normName=s=>String(s||'').toLowerCase().replace(/\b(blok|block|tower|menara|wing)\s*[a-z0-9]{1,2}\b/g,'').replace(/[^a-z0-9一-龥]+/g,' ').trim();

/* ========== 状态 ========== */
let PLAN=LS.get('rcm-plan',null);         // 选好的线路方案
let DATA=LS.get('rcm-data',{});           // 各公寓的价格资料（按名字）
let UI=LS.get('rcm-ui',{pm:'ask',layer:'sat',radius:500});
let LINES=[];                              // 找到的线路列表
const saveUI=()=>LS.set('rcm-ui',UI),savePlan=()=>LS.set('rcm-plan',PLAN),saveData=()=>LS.set('rcm-data',DATA);
const dOf=c=>DATA[c.k]||(DATA[c.k]={});
const pv=c=>{const d=DATA[c.k]||{};return +(UI.pm==='tx'?d.tx:d.ask)||0;};

/* ========== 地图引擎：2D / 3D（WebGL），街道 / 卫星 / 地形，免 key ========== */
const TILES={st:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
  sat:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  topo:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',
  ref:'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}'};
if(!UI.layer||!TILES[UI.layer]||UI.layer==='ref')UI.layer='sat';if(UI.d3==null)UI.d3=false;
const V={lat:3.10,lng:101.70,z:11,pitch:0,bear:0};
let W=0,H=0,DPR=1;const cv=$('cv'),g=cv.getContext('2d'),glc=$('glc');
const gl=glc.getContext('webgl',{antialias:true,alpha:false,premultipliedAlpha:false})||glc.getContext('experimental-webgl');
function lx(lng,z){return (lng+180)/360*256*2**z;}
function ly(lat,z){const s=Math.sin(lat*R2);return (0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*256*2**z;}
function unx(x,z){return x/(256*2**z)*360-180;}
function uny(y,z){const n=Math.PI-2*Math.PI*y/(256*2**z);return 180/Math.PI*Math.atan(Math.sinh(n));}
function mpp(lat){return 156543.03392*Math.cos(lat*R2)/2**V.z;}
/* ---- 相机：跟 Mapbox 一样，2D 时 1 单位 = 1 屏幕像素 ---- */
const FOV=36.87*R2;let CAM=null;
function vsub(a,b){return [a[0]-b[0],a[1]-b[1],a[2]-b[2]];}function vdot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}
function vcross(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}function vnorm(a){const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];}
function rotZ(v,b){const c=Math.cos(b),s=Math.sin(b);return [v[0]*c-v[1]*s,v[0]*s+v[1]*c,v[2]];}
function camSetup(){const D=(H/2)/Math.tan(FOV/2),ph=V.pitch*R2,be=-V.bear*R2;
  const eye=rotZ([0,D*Math.sin(ph),D*Math.cos(ph)],be),up=rotZ([0,-Math.cos(ph),Math.sin(ph)],be);
  const f=vnorm(vsub([0,0,0],eye)),r=vnorm(vcross(f,up)),u=vcross(r,f);
  const near=Math.max(1,D*0.05),far=D*12;const t=1/Math.tan(FOV/2),a=W/H;
  /* 列主序矩阵（WebGL 用） */
  const Vm=[r[0],u[0],-f[0],0, r[1],u[1],-f[1],0, r[2],u[2],-f[2],0, -vdot(r,eye),-vdot(u,eye),vdot(f,eye),1];
  const Pm=[t/a,0,0,0, 0,t,0,0, 0,0,(far+near)/(near-far),-1, 0,0,2*far*near/(near-far),0];
  const M=new Array(16);for(let i=0;i<4;i++)for(let j=0;j<4;j++){let s=0;for(let k=0;k<4;k++)s+=Pm[k*4+i]*Vm[j*4+k];M[j*4+i]=s;}

/* ========== CSV 导入 / 导出 ========== */
const COLS=['name','station','ask_psf','tx_psf','tx_count','rent_min','rent_max','size_sqft','units','year','tenure','featured','lat','lng'];
const MAPK={ask_psf:'ask',tx_psf:'tx',tx_count:'txn',rent_min:'rmin',rent_max:'rmax',size_sqft:'size',units:'units',year:'yr',tenure:'tenure'};
function csvCell(v){v=v==null?'':String(v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}
function exportCSV(){if(!PLAN||!PLAN.condos){toast('先选线路、找公寓');return;}const rows=[COLS.join(',')];
  condos().forEach(c=>{const d=DATA[c.k]||{},s=PLAN.stations.find(x=>x.id===c.st)||{};rows.push([c.name,s.name,d.ask,d.tx,d.txn,d.rmin,d.rmax,d.size,d.units,d.yr,d.tenure,d.feat?1:'',c.lat.toFixed(6),c.lng.toFixed(6)].map(csvCell).join(','));});
  const blob=new Blob(['﻿'+rows.join('\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=(PLAN.lineName||'line').replace(/[^\w一-龥]+/g,'_')+'-公寓价格.csv';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);toast('表格已下载');}
function parseCSV(t){const out=[];let row=[],f='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=ch;}else if(ch==='"')q=true;else if(ch===','){row.push(f);f='';}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(f);out.push(row);row=[];f='';}else f+=ch;}if(f||row.length){row.push(f);out.push(row);}return out.filter(r=>r.some(x=>x.trim()));}
$('fileIn').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const t=(await f.text()).replace(/^﻿/,'');const R=parseCSV(t);if(R.length<2){toast('表格是空的');return;}
  const hd=R[0].map(h=>h.trim().toLowerCase());const ix=k=>hd.indexOf(k);if(ix('name')<0){toast('表格要有 name 这一栏');return;}let up=0,add=0,miss=0;
  R.slice(1).forEach(r=>{const nm=(r[ix('name')]||'').trim();if(!nm)return;const k=normName(nm);let c=PLAN&&PLAN.condos&&PLAN.condos.find(x=>x.k===k);
    if(!c&&PLAN&&ix('lat')>=0&&+r[ix('lat')]){const la=+r[ix('lat')],lo=+r[ix('lng')];let best=null,bd=1e9;PLAN.stations.forEach(s=>{const d=hav(la,lo,s.lat,s.lng);if(d<bd){bd=d;best=s;}});
      if(best){c={k,name:nm,short:nm.slice(0,22),lat:la,lng:lo,st:best.id,dist:Math.round(bd),manual:true};PLAN.condos.push(c);add++;}}
    if(!c){miss++;return;}const d=DATA[k]||(DATA[k]={});for(const [col,key] of Object.entries(MAPK)){const i=ix(col);if(i>=0&&r[i]!==undefined&&r[i].trim()!=='')d[key]=key==='tenure'?r[i].trim():+r[i].replace(/[^\d.]/g,'');}
    if(ix('featured')>=0)d.feat=/^(1|y|yes|true|是|⭐)$/i.test((r[ix('featured')]||'').trim());d.demo=false;up++;});
  saveData();savePlan();refresh();toast(`更新 ${up} 个盘${add?'，新加 '+add+' 个':''}${miss?'，'+miss+' 个对不上名字':''}`,4000);};

/* ========== 📍 周边地标（3 / 5 公里） ========== */
const CATS={mall:{i:'🛍',n:'商场'},sch:{i:'🏫',n:'学校'},hos:{i:'🏥',n:'医院'},stn:{i:'🚉',n:'车站'},hwy:{i:'🛣',n:'大路入口'},mkt:{i:'🛒',n:'超市'},fuel:{i:'⛽',n:'油站'},park:{i:'🌳',n:'公园'}};
if(!UI.lmOn)UI.lmOn={mall:1,sch:1,hos:1,stn:1,hwy:1,mkt:1,fuel:0,park:0};
function catOf(t){if(t.shop==='mall')return 'mall';if(/^(school|university|college)$/.test(t.amenity||''))return 'sch';if(t.amenity==='hospital')return 'hos';
  if(t.railway==='station'||t.public_transport==='station')return 'stn';if(t.highway==='motorway_junction')return 'hwy';if(t.shop==='supermarket')return 'mkt';if(t.amenity==='fuel')return 'fuel';if(t.leisure==='park')return 'park';return null;}
function hubCondo(){const cs=condos();return cs.find(c=>(DATA[c.k]||{}).feat)||(ACT&&ACT.c&&PLAN.condos.find(c=>c.k===ACT.c))||null;}
function hubLL(){const c=hubCondo();if(c)return {lat:c.lat,lng:c.lng,name:c.name};const m=toLL(W/2,H/2);return {lat:m[0],lng:m[1],name:'地图中心'};}
async function loadLandmarks(r){const h=hubLL();busy(1,`正在找 ${r/1000} 公里内的地标…`);try{
  const a=`(around:${r},${h.lat.toFixed(5)},${h.lng.toFixed(5)})`;const sel=['["shop"="mall"]["name"]','["amenity"~"^(school|university|college)$"]["name"]','["amenity"="hospital"]["name"]','["railway"="station"]["name"]','["highway"="motorway_junction"]','["shop"="supermarket"]["name"]','["amenity"="fuel"]["name"]','["leisure"="park"]["name"]'];
  const j=await overpass(`[out:json][timeout:90];(${sel.map(s=>`node${s}${a};way${s}${a};`).join('')});out center tags;`);
  const by={},seen=new Set();j.elements.forEach(e=>{const t=e.tags||{},c=e.center||e;if(c.lat==null)return;const k=catOf(t);if(!k)return;
    let nm=(t['name:en']||t.name||'').trim();if(k==='hwy')nm=nm||(t.ref?'出口 '+t.ref:'大路出入口');if(!nm)return;const key=k+'|'+nm.toLowerCase();if(seen.has(key))return;seen.add(key);
    (by[k]=by[k]||[]).push({cat:k,name:nm,lat:c.lat,lng:c.lon,d:Math.round(hav(h.lat,h.lng,c.lat,c.lon))});});
  const items=[];Object.values(by).forEach(L=>{L.sort((x,y)=>x.d-y.d);items.push(...L.slice(0,15));});
  PLAN.lm={lat:h.lat,lng:h.lng,name:h.name,r,items};savePlan();toast(`找到 ${items.length} 个地标`);}catch(e){toast('找地标失败：'+(e.message||e),4000);}finally{busy(0);}openLandmarks();}
function openLandmarks(){if(!PLAN){openSetup();return;}const L=PLAN.lm,h=hubLL();
  const list=L?Object.keys(CATS).map(k=>{const it=L.items.filter(x=>x.cat===k);if(!it.length)return '';return `<details ${UI.lmOn[k]?'open':''}><summary>${CATS[k].i} ${CATS[k].n}（${it.length}）</summary>${it.map((x,i)=>`<div class="li" data-lm="${L.items.indexOf(x)}"><span style="font-size:20px">${CATS[k].i}</span><div class="nm"><b>${esc(x.name)}</b><small>直线 ${(x.d/1000).toFixed(1)} 公里</small></div><button data-go="${L.items.indexOf(x)}">🚗 开过去</button></div>`).join('')}</details>`;}).join(''):'';
  sheet('📍 周边地标',`<p class="hint" style="margin-top:0">中心：<b>${esc(L?L.name:h.name)}</b>${hubCondo()?'':'（设一个 ⭐ 主推盘，就会以它为中心）'}</p>
   <div class="row"><span class="seg">${[3000,5000].map(r=>`<button data-lr="${r}" class="${L&&L.r===r?'on':''}">${r/1000} 公里</button>`).join('')}</span><button class="pri" id="lmGo">🔎 ${L?'重新找':'找地标'}</button></div>
   <p class="hint">按种类开关地图上的图标：</p><div class="row">${Object.entries(CATS).map(([k,c])=>`<button data-lc="${k}" class="${UI.lmOn[k]?'on':''}">${c.i} ${c.n}</button>`).join('')}</div>${list}
   <p class="hint">地标来自免费的 OpenStreetMap，距离是直线。按「🚗 开过去」会画出真的马路路线并模拟开车。</p>`);
  let R=(L&&L.r)||5000;$('shB').querySelectorAll('[data-lr]').forEach(b=>b.onclick=()=>{R=+b.dataset.lr;$('shB').querySelectorAll('[data-lr]').forEach(x=>x.classList.toggle('on',x===b));});

function lineCol(n,osm){const k=lineKind(n);if(k!=='长途'&&k!=='其他'){const g=grpName(n);for(const [re,c] of OFFC)if(re.test(g))return c;for(const [re,c] of OFFC)if(re.test(n))return c;}
  if(/^#?[0-9a-f]{6}$/i.test(osm||''))return osm[0]==='#'?osm:'#'+osm;return {KTM:'#1964B7',LRT:'#D50032',MRT:'#047940','单轨':'#84BD00','机场线':'#8D198F',BRT:'#115740'}[k]||'#64748b';}
function groups(){const M=new Map();(LINES||[]).forEach(l=>{const kind=lineKind(l.name);let key;
    if(/[:：]/.test(l.name))key=grpName(l.name);else if(l.from&&l.to)key=kind+'|'+[l.from,l.to].sort().join('|');else key=grpName(l.name);
    let g=M.get(key);if(!g){g={key,id:l.id,ids:[],name:grpName(l.name)||l.name,kind,col:lineCol(l.name,l.color)};M.set(key,g);}g.ids.push(l.id);});
  return [...M.values()].sort((a,b)=>a.name.localeCompare(b.name));}
let NET=LS.get('rcm-net',null);
async function loadNet(rk){const G=groups().filter(g=>g.kind!=='长途');if(!G.length)return;
  try{toast('正在把全部路线画上颜色…',2500);const j=await overpass(`[out:json][timeout:90];relation(id:${G.map(g=>g.id).join(',')});foreach->.x(.x out ids;way(r.x)["railway"];out geom qt;);`);
    const by=new Map(G.map(g=>[g.id,{id:g.id,ids:g.ids,name:g.name,kind:g.kind,col:g.col,ways:[]}]));let cur=null;
    for(const e of j.elements){if(e.type==='relation'){cur=by.get(e.id)||null;continue;}if(!cur||e.type!=='way'||!e.geometry)continue;
      const P=[];let la=null,lo=null;e.geometry.forEach((q,i)=>{if(i&&i<e.geometry.length-1&&la!=null&&hav(la,lo,q.lat,q.lon)<30)return;la=q.lat;lo=q.lon;P.push(+q.lat.toFixed(5),+q.lon.toFixed(5));});if(P.length>=4)cur.ways.push(P);}
    const out=[...by.values()].filter(g=>g.ways.length);out.forEach(g=>{let best=g.ways[0];g.ways.forEach(w=>{if(w.length>best.length)best=w;});const m=Math.floor(best.length/4)*2;g.mid=[best[m],best[m+1]];});
    NET={rk,lines:out};LS.set('rcm-net',NET);req();}catch(e){toast('路线颜色读不到：'+(e.message||e),3500);}}
function drawNet(){if(!NET||RT.on||V.z<8.5)return;const sat=UI.layer==='sat',step=V.z<11?3:1;g.lineJoin='round';g.lineCap='round';
  for(const L of NET.lines){const on=PLAN&&L.ids.includes(PLAN.lineId);
    for(const w of L.ways){const P=[];for(let i=0;i<w.length;i+=2*step)P.push(toScr(w[i],w[i+1]));const n=w.length;if((n/2-1)%step)P.push(toScr(w[n-2],w[n-1]));
      pathTo(P);g.globalAlpha=on?1:0.9;g.strokeStyle=sat?'rgba(255,255,255,.9)':'#fff';g.lineWidth=on?7:5.5;g.stroke();g.strokeStyle=L.col;g.lineWidth=on?4.5:3.2;g.stroke();g.globalAlpha=1;}}}
const LNE=new Map();
function placeNet(){const show=NET&&!RT.on&&V.z>=9&&V.z<14.5;const used=new Set();
  if(show)NET.lines.forEach(L=>{if(!L.mid||(PLAN&&L.ids.includes(PLAN.lineId)&&V.z>=11.5))return;const p=toScr(L.mid[0],L.mid[1]);if(p[2]<=0||p[0]<-50||p[1]<-30||p[0]>W+50||p[1]>H+30)return;const k='n'+L.id;used.add(k);
    let e=LNE.get(k);if(!e){e=document.createElement('div');e.className='lnp';$('labs').appendChild(e);LNE.set(k,e);e.addEventListener('click',ev=>{ev.stopPropagation();pickLine(L);});}
    e.style.setProperty('--c',L.col);e.textContent=L.name;e.style.transform=`translate(${p[0]}px,${p[1]}px) translate(-50%,-50%)`;e.style.display='';});
  LNE.forEach((e,k)=>{if(!used.has(k))e.style.display='none';});}
function pickLine(L){const e=$('lnPick');e.style.setProperty('--c',L.col);e.innerHTML=`<i></i><b>${esc(L.name)}</b><button>选这条线 ▶</button>`;e.classList.add('show');clearTimeout(pickLine.t);pickLine.t=setTimeout(()=>e.classList.remove('show'),6000);
  e.querySelector('button').onclick=()=>{e.classList.remove('show');if(PLAN&&L.ids.includes(PLAN.lineId)){openSetup();return;}loadLine(L.id);};}
let DN=null;mp.addEventListener('pointerdown',e=>{DN=[e.clientX,e.clientY];},true);
mp.addEventListener('click',e=>{if(ADD||!NET||RT.on||V.z<8.5)return;if(DN&&Math.hypot(e.clientX-DN[0],e.clientY-DN[1])>8)return;
  let best=null,bd=16;for(const L of NET.lines)for(const w of L.ways){let a=toScr(w[0],w[1]);for(let i=2;i<w.length;i+=2){const b=toScr(w[i],w[i+1]);if(a[2]>0&&b[2]>0){const d=segD(e.clientX,e.clientY,a,b);if(d<bd){bd=d;best=L;}}a=b;}}
  if(best)pickLine(best);});
function segD(x,y,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],l=dx*dx+dy*dy||1;let t=((x-a[0])*dx+(y-a[1])*dy)/l;t=Math.max(0,Math.min(1,t));return Math.hypot(x-a[0]-t*dx,y-a[1]-t*dy);}

window.__rcm={PLAN:()=>PLAN,DATA:()=>DATA,V};
