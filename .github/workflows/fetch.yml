name: Fetch 3D
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fetch.yml'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -L -o index.html https://3dporp.netlify.app/
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add index.html
          git commit -m "Import 3D from Netlify" || echo "no changes"
          git push
