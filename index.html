<title>Prop 3D 楼盘分析</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2430;--mute:#6b7380;--line:#e3e6eb;--acc:#2563eb;--ok:#16a34a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);-webkit-user-select:none;user-select:none}
#view{position:fixed;inset:0;touch-action:none}
#view canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden}
.lab{position:absolute;transform:translate(-50%,-100%);background:#ffffffe0;border:1px solid #0000001a;border-radius:8px;padding:2px 7px;font-size:12.5px;line-height:1.25;text-align:center;white-space:nowrap;color:#4b5563}
.lab b{display:block;font-size:13.5px;color:#7a5b00}
.lab.nb b{color:#374151}
.lab.north{background:none;border:none;color:#e02424;font-weight:800;font-size:20px;transform:translate(-50%,-50%)}
.lab.pt{background:#2563eb;color:#fff;border:none;font-weight:700;transform:translate(-50%,-130%);padding:1px 6px}
button{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 12px;cursor:pointer;white-space:nowrap}
button:active{transform:scale(.97)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.go{background:var(--ok);border-color:var(--ok);color:#fff}
button.ai{background:#7c3aed;border-color:#7c3aed;color:#fff}
button.danger{color:#c62828}
button:disabled{opacity:.4}
input,select,textarea{font:inherit;font-size:16px;border:1px solid var(--line);border-radius:8px;padding:7px 8px;background:#fff;color:var(--ink);min-width:0;-webkit-user-select:text;user-select:text}
#top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 8px) calc(env(safe-area-inset-right) + 10px) 8px calc(env(safe-area-inset-left) + 10px);display:flex;gap:7px;align-items:center;overflow-x:auto;background:linear-gradient(#f6f7f9f2 70%,#f6f7f900);z-index:5;scrollbar-width:none}
#top::-webkit-scrollbar{display:none}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none;background:#fff}
.seg button{border:none;border-radius:0;border-right:1px solid var(--line);padding:9px 11px}
.seg button:last-child{border-right:none}
.seg button.sel{background:var(--ink);color:#fff}
.sep{width:1px;height:26px;background:var(--line);flex:none}
.flags{display:flex;gap:2px;flex:none;border:1px solid var(--line);border-radius:10px;background:#fff;padding:2px}
.flags button{border:none;padding:5px 7px;font-size:20px;line-height:1;border-radius:8px;opacity:.45;background:none}
.flags button.sel{opacity:1;background:#eef2ff}
.flags button{display:none}
.flags button.sel,.flags.open button{display:block}
.flags:not(.open) button.sel::after{content:'▾';font-size:11px;color:#6b7380;margin-left:3px;vertical-align:3px}
.flags.open button.sel{background:#dbeafe}

<script>
/* 大的资料（底图、平面图、画图稿）存到 IndexedDB；项目本身同时多存一份到 IndexedDB，
   localStorage 来不及写好（App 被关掉、空间满）时，开的时候用较新的那份 */
(function(){try{const LS=window.localStorage;if(!LS||!window.indexedDB)return;
const BIG=k=>typeof k==='string'&&/^loupan-my-v1-img|^prop3d-plan$|^prop3d-plans$|^prop3d-dwdraft|^prop3d-extra$/.test(k);
const SK=k=>typeof k==='string'&&/^loupan-my-v1(:|$)|^prop3d-projects$|^prop3d-cur$/.test(k);
const P=Storage.prototype,g=P.getItem,s=P.setItem,r=P.removeItem,kf=P.key;const MEM=new Map(),BOOT=new Map();let db=null;const q=[];
for(let i=LS.length-1;i>=0;i--){const k=kf.call(LS,i);if(BIG(k))MEM.set(k,g.call(LS,k));else if(SK(k))BOOT.set(k,{v:g.call(LS,k),t:+(g.call(LS,'kvt:'+k)||0)});}
function put(k,v){if(!db){q.push([k,v]);return Promise.resolve(false);}return new Promise(res=>{try{const tx=db.transaction('kv','readwrite'),st=tx.objectStore('kv');v==null?st.delete(k):st.put(v,k);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);tx.onabort=()=>res(false);}catch(e){res(false);}});}
P.getItem=function(k){if(this===LS&&BIG(k))return MEM.has(k)?MEM.get(k):null;return g.call(this,k);};
P.setItem=function(k,v){if(this!==LS)return s.call(this,k,v);
  if(BIG(k)){v=String(v);MEM.set(k,v);put(k,v).then(ok=>{if(ok)try{r.call(LS,k);}catch(e){}});return;}
  if(SK(k)){v=String(v);const t=Date.now();put(k,{v,t});try{s.call(LS,k,v);s.call(LS,'kvt:'+k,String(t));}catch(e){window.__kvFail=e;throw e;}return;}
  try{return s.call(this,k,v);}catch(e){window.__kvFail=e;throw e;}};
P.removeItem=function(k){if(this===LS&&(BIG(k)||SK(k))){MEM.delete(k);put(k,null);try{r.call(LS,'kvt:'+k);}catch(e){}}return r.call(this,k);};
window.KV={mem:MEM,ready:new Promise(res=>{let rq;try{rq=indexedDB.open('prop3d-kv',1);}catch(e){return res([]);}
  rq.onupgradeneeded=()=>rq.result.createObjectStore('kv');rq.onerror=()=>res([]);
  rq.onsuccess=async()=>{db=rq.result;const all=await new Promise(rs=>{const out=[];try{const c=db.transaction('kv','readonly').objectStore('kv').openCursor();c.onsuccess=()=>{const x=c.result;if(x){out.push([x.key,x.value]);x.continue();}else rs(out);};c.onerror=()=>rs(out);}catch(e){rs(out);}});
    const fresh=[],inDb=new Set();
    for(const [k,v] of all){inDb.add(k);
      if(SK(k)){const b=BOOT.get(k);if(v&&v.v!=null&&(!b||v.t>b.t)&&(!b||b.v!==v.v)){try{s.call(LS,k,v.v);s.call(LS,'kvt:'+k,String(v.t));}catch(e){}fresh.push(k);}continue;}
      if(MEM.get(k)!==v){MEM.set(k,v);fresh.push(k);}try{r.call(LS,k);}catch(e){}}
    for(const [k,v] of [...MEM]){if(!inDb.has(k)&&v!=null){if(await put(k,v))try{r.call(LS,k);}catch(e){}}}
    for(const [k,b] of BOOT){if(!inDb.has(k)&&b.v!=null)put(k,{v:b.v,t:b.t||Date.now()});}
    while(q.length){const [k,v]=q.shift();if(SK(k)&&fresh.includes(k))continue;await put(k,v);}res(fresh);};})};
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();}catch(e){}
}catch(e){}})();
</script>

help_html:`<p class="hint">最快的上手方式：点左上角紫色的<b>「AI 建模」</b>，或绿色的<b>「向导」</b>按步骤做。</p>
<h4>一、怎么做「周边地图」底图</h4><ol>
<li>打开 <b>Google 地图</b>（或 Apple 地图），搜索楼盘名字。</li>
<li>切换到<b>卫星图</b>，要看得到楼顶。</li>
<li><b>保持正北朝上</b>：不要旋转地图，转过的话点一下指南针就会复位。</li>
<li>双指缩放，让<b>楼盘和周围一两条马路</b>都在屏幕里，大约 300–600 米的范围。</li>
<li><b>截屏</b>，截图里要有地图角落的<b>比例尺</b>。</li>
<li>回到本工具：向导 ① 选择截图 → ② 点比例尺两端，输入米数 → ③ 点「正北朝上」。</li></ol>
<h4>二、怎么「描楼」</h4><ol>
<li>点「描楼」，在上方小工具栏选「本小区」或「周边」，填层数。</li>
<li>在底图上依次点 3 下：<b>① 楼顶的一个角 → ② 沿长边的另一个角 → ③ 对面那条边上任意一点</b>。</li>
<li>楼会自动生成，可以接着描下一栋，最后点「完成」。</li>
<li>层数可以在 iProperty、PropertyGuru、EdgeProp 查，或现场数阳台。</li></ol>
<h4>三、各个分析（按马来西亚情况）</h4><ul>
<li><b>日照</b>：每户一天有几小时直射阳光。马来西亚靠近赤道，3 月、9 月太阳几乎在头顶，6 月偏北，12 月偏南，可以在底部切换看看。</li>
<li><b>西晒</b>：每户下午 2 点以后晒多久。西晒多的单位下午很热、冷气费高，买房时要特别留意。</li>
<li><b>噪音</b>：先用「＋道路」画出马路，再选等级。数值参考马来西亚环境局（DOE）2019 年的环境噪音指南。</li>
<li><b>通风</b>：风向按 MetMalaysia 的季风：东北季风（11 月–3 月）和西南季风（5 月–9 月），在「设置」里切换。</li>
<li><b>报告</b>：逐层逐户的表格，可以复制到 Excel 或 WhatsApp。</li>
<li><b>视野</b>：选中一栋楼，选楼层和户，点「进入视野」，按住屏幕拖动环顾四周。</li>
<li><b>展示</b>：先打开 iPad 的「屏幕录制」，再点「展示」，可以录成短视频。</li></ul>
<h4>四、手势</h4><ul><li>单指拖动：旋转；双指捏合：缩放；双指拖动：平移。</li><li>点一下楼：选中；按住选中的楼拖动：移动；点错了按「撤销」。</li></ul>
<p class="hint">噪音、通风为简化估算，适合比较哪栋哪层更好，不等于专业报告。方案自动保存在这台设备的浏览器里。</p>`

help_html:`<p class="hint">Quickest start: tap the purple <b>AI Build</b>, or follow the green <b>Guide</b> step by step.</p>
<h4>1. Make the base map</h4><ol>
<li>Open <b>Google Maps</b> (or Apple Maps) and search for the project.</li>
<li>Switch to <b>satellite</b> so you can see the rooftops.</li>
<li><b>Keep north up</b> — do not rotate the map; tap the compass to reset it.</li>
<li>Pinch so <b>the project and one or two nearby roads</b> fill the screen (about 300–600 m across).</li>
<li><b>Take a screenshot</b> that includes the map's <b>scale bar</b>.</li>
<li>In this tool: Guide ① choose the screenshot → ② tap both ends of the scale bar and enter the metres → ③ tap "North up".</li></ol>
<h4>2. Trace buildings</h4><ol>
<li>Tap "Trace", choose Project or Nearby in the small bar at the top and enter the floors.</li>
<li>Tap 3 points on the map: <b>① a roof corner → ② the next corner along the long side → ③ any point on the opposite side</b>.</li>
<li>The block appears; keep tracing, then tap Done.</li>
<li>Find floor counts on iProperty, PropertyGuru or EdgeProp, or count balconies on site.</li></ol>
<h4>3. Analyses (for Malaysia)</h4><ul>
<li><b>Sun</b>: hours of direct sun per unit. Near the equator the sun is almost overhead in March and September, north in June and south in December — switch dates at the bottom.</li>
<li><b>West sun</b>: hours of sun after 2 pm. Units with heavy west sun are hot in the afternoon and cost more to cool.</li>
<li><b>Noise</b>: draw the roads with "+ Road" and pick their type. Reference values follow the Malaysia DOE noise guidelines (2019).</li>
<li><b>Wind</b>: MetMalaysia monsoons — Northeast (Nov–Mar) and Southwest (May–Sep). Switch in Settings.</li>
<li><b>Report</b>: floor-by-floor, unit-by-unit tables you can copy into Excel or WhatsApp.</li>
<li><b>View</b>: select a block, choose floor and unit, tap "Enter view" and drag to look around.</li>
<li><b>Show</b>: start iPad screen recording, then tap Show to record a short fly-around.</li></ul>

help_html:`<p class="hint">Cara paling cepat: tekan butang ungu <b>Bina AI</b>, atau ikut <b>Panduan</b> hijau langkah demi langkah.</p>
<h4>1. Sediakan peta asas</h4><ol>
<li>Buka <b>Google Maps</b> (atau Apple Maps) dan cari nama projek.</li>
<li>Tukar ke <b>satelit</b> supaya bumbung kelihatan.</li>
<li><b>Kekalkan utara di atas</b> — jangan putar peta; tekan kompas untuk set semula.</li>
<li>Cubit supaya <b>projek dan satu dua jalan berhampiran</b> memenuhi skrin (kira-kira 300–600 m).</li>
<li><b>Ambil tangkapan skrin</b> yang mengandungi <b>bar skala</b> peta.</li>
<li>Dalam alat ini: Panduan ① pilih tangkapan skrin → ② tekan kedua-dua hujung bar skala dan masukkan meter → ③ tekan "Utara di atas".</li></ol>
<h4>2. Surih bangunan</h4><ol>
<li>Tekan "Surih", pilih Projek atau Sekitar pada bar kecil di atas dan masukkan bilangan tingkat.</li>
<li>Tekan 3 titik pada peta: <b>① satu penjuru bumbung → ② penjuru seterusnya di sisi panjang → ③ mana-mana titik di sisi bertentangan</b>.</li>
<li>Blok akan muncul; teruskan menyurih, kemudian tekan Siap.</li>
<li>Bilangan tingkat boleh disemak di iProperty, PropertyGuru atau EdgeProp, atau kira balkoni di tapak.</li></ol>
<h4>3. Analisis (untuk Malaysia)</h4><ul>
<li><b>Matahari</b>: jam cahaya matahari langsung setiap unit. Berhampiran khatulistiwa, matahari hampir tegak pada Mac dan September, di utara pada Jun dan di selatan pada Disember — tukar tarikh di bawah.</li>
<li><b>Panas petang</b>: jam matahari selepas 2 petang. Unit yang banyak terkena panas petang lebih panas dan lebih mahal untuk disejukkan.</li>
<li><b>Bunyi</b>: lukis jalan dengan "+ Jalan" dan pilih jenisnya. Nilai rujukan mengikut garis panduan bunyi JAS (2019).</li>
<li><b>Angin</b>: monsun MetMalaysia — Timur Laut (Nov–Mac) dan Barat Daya (Mei–Sep). Tukar dalam Tetapan.</li>
<li><b>Laporan</b>: jadual setiap tingkat dan unit yang boleh disalin ke Excel atau WhatsApp.</li>
<li><b>Pandangan</b>: pilih blok, tingkat dan unit, tekan "Lihat" dan seret untuk melihat sekeliling.</li>
<li><b>Tayang</b>: mula rakaman skrin iPad, kemudian tekan Tayang untuk merakam video pendek.</li></ul>
<h4>4. Gerak isyarat</h4><ul><li>Satu jari: putar. Cubit: zum. Seret dua jari: alih.</li><li>Tekan blok untuk memilih; tekan dan seret blok terpilih untuk mengalih; tekan Buat asal jika tersilap.</li></ul>
<p class="hint">Bunyi dan angin ialah anggaran ringkas untuk membandingkan blok dan tingkat, bukan laporan profesional. Projek anda disimpan dalam pelayar pada peranti ini.</p>`

    for(let i=0;i<b.floors;i++){const row=[];
      for(let k=0;k<slots.length;k++){const sl=slots[k];if(sl.core){row.push(null);continue;}
        const faces=[[slotPoint(b,sl,i,0.05),slotNormal(b,sl)]];if(sl.sx||sl.sz)faces.push([slotPoint(b,sl,i,0.05,undefined,true),slotNormal(b,sl,true)]);

  if(tg.id==='trF'){const v=parseInt(tg.value);if(v>=1&&v<=100)traceFloors=v;return;}
  if(tg.id==='gNorth'){S.north=Number(tg.value);S.northSet=true;$('gNorthV').textContent=S.north+'°';northChanged();return;}
  if(tg.dataset.road){pushUndo();const r=S.roads.find(r=>r.id===Number(tg.dataset.road));r.type=tg.value;buildRoads();save();invalidate();return;}
  if(tg.id==='rdType'){drawRoad.type=tg.value;buildRoads();return;}
  if(tg.dataset.k){const b=bById(selId);if(!b)return;const k=tg.dataset.k;pushUndo();
    if(k==='name'){b.name=tg.value;syncLabels();save();return;}
    if(k==='note'){b.note=tg.value;save();return;}

    if(k==='front'||k==='back'){b[k]=tg.value;buildBuilding(b);save();invalidate();return;}
    if(k==='type'||k==='face'){b[k]=tg.value;if(k==='type'){b.units=tg.value==='nb'?1:Math.max(2,b.units);}changed(b,true);return;}
    const v=parseFloat(tg.value);if(isNaN(v))return;const L=LIM[k];if(v<L[0]||v>L[1])return;b[k]=(k==='floors'||k==='units')?Math.round(v):v;
    if(k==='rot'){$('rotL').textContent=t('f_rot',v);buildBuilding(b);save();invalidate();return;}
    changed(b,false);return;}
  if(tg.id==='sCity'){const c=CITIES.find(c=>c[0]===tg.value);if(c){S.city=c[0];S.lat=c[3];S.lon=c[4];$('sLat').value=c[3];$('sLon').value=c[4];}else S.city='custom';sunChanged();return;}
  if(tg.id==='sLat'||tg.id==='sLon'){const la=parseFloat($('sLat').value),lo=parseFloat($('sLon').value);if(!isNaN(la)&&la>=-66&&la<=66&&!isNaN(lo)&&lo>=90&&lo<=130){S.lat=la;S.lon=lo;S.city='custom';$('sCity').value='custom';sunChanged();}return;}
  if(tg.id==='sNorth'){S.north=Number(tg.value);S.northSet=true;$('sNorthL').textContent=t('s_north',S.north);northChanged();return;}
  if(tg.id==='sBaseW'){const v=parseFloat(tg.value);if(!isNaN(v)&&v>=30&&v<=5000){S.baseW=v;buildGround();save();invalidate();}return;}
  if(tg.id==='sOp'){S.imgOpacity=Number(tg.value);save();redraw();return;}
  if(tg.id==='sA'||tg.id==='sB'){const a=parseFloat($('sA').value),b=parseFloat($('sB').value);if(a>=5&&b<=21&&a<b){S.anaStart=a;S.anaEnd=b;save();invalidate();legend();}return;}
  if(tg.id==='sWf'){const v=parseFloat(tg.value);if(v>=11&&v<=18){S.westFrom=v;save();invalidate();legend();}return;}
  if(tg.id==='sNight'){S.night=tg.value==='1';save();invalidate();legend();return;}
  if(tg.id==='sWind'){S.windFrom=Number(tg.value);save();invalidate();legend();return;}
});

function viewInfo(){
  const v=VIEW,b=v.b,eye=v.eye;let hits=0,tot=0,near=null;
  for(let a=-60;a<=60;a+=5){const r=rotY(v.nw[0],v.nw[1],rad(a));const h=firstHit(eye.x,eye.y,eye.z,r[0],0,r[1],b.id,300);tot++;if(h&&h.t<150)hits++;if(a===0)near=h;}
  const open=Math.round((1-hits/tot)*100),Nn=enu(0,1,0),Ee=enu(1,0,0);
  const dirn=azName((deg(Math.atan2(v.nw[0]*Ee[0]+v.nw[1]*Ee[2],v.nw[0]*Nn[0]+v.nw[1]*Nn[2]))+360)%360);
  $('viewInfo').innerHTML=`<b>${t('vi_head',esc(b.name),v.floor,b.type==='own'&&v.slots.length>1?' · '+t('view_unit',esc(unitLabel(v.slots[v.unit].label))):'',dirn)}</b><br>`+
    (near?t('vi_front',near.t.toFixed(0),esc(near.o.name),near.o.floors,(near.o.fh*near.o.floors).toFixed(0)):t('vi_clear'))+`<br>${t('vi_open',open)}<br><span style="color:#6b7380;font-size:12.5px">${t('vi_drag')}</span>`;
}
function placeView(){const v=VIEW;v.eye=slotPoint(v.b,v.slots[v.unit],v.floor-1,0.6,1.5);viewInfo();redraw();}
function enterView(b,floor,unit){if(PRES)return;let slots=slotsOf(b);if(b.type!=='own'){const fi=faceInfo(b,'S');slots=[{cx:0,cz:0,hx:b.w/2,hz:b.d/2,nx:fi.lx,nz:fi.lz,label:'',core:false}];unit=0;}
  if(!slots[unit]||slots[unit].core)unit=slots.findIndex(x=>!x.core);const nw=slotNormal(b,slots[unit]);
  VIEW={b,floor,unit,slots,nw,yaw:Math.atan2(nw[0],nw[1]),pitch:0,fov:65};
  document.body.classList.add('viewing');$('viewbar').classList.add('show');placeView();}

let playing=false;
function bbox(){let x0=Infinity,x1=-Infinity,z0=Infinity,z1=-Infinity,mh=0;const bs=S.buildings.length?S.buildings:[{x:0,z:0,w:100,d:100,fh:3,floors:10}];
  bs.forEach(b=>{const e=Math.max(b.w,b.d)/2;x0=Math.min(x0,b.x-e);x1=Math.max(x1,b.x+e);z0=Math.min(z0,b.z-e);z1=Math.max(z1,b.z+e);mh=Math.max(mh,b.fh*b.floors);});
  return {c:[(x0+x1)/2,0,(z0+z1)/2],r:Math.hypot(x1-x0,z1-z0)/2,mh};}
function startPres(){
  endTools();if(VIEW)exitView();selId=null;hl=null;paint();playing=false;$('bPlay').textContent='▶';
  const bb=bbox(),r=Math.max(80,bb.r,bb.mh*0.9);
  PRES={t0:performance.now(),r,c:bb.c,save:{t:cam.t.slice(),dist:cam.dist,yaw:cam.yaw,pitch:cam.pitch,min:S.minutes},start:cam.yaw};
  document.body.classList.add('present');S.buildings.forEach(b=>groupsScale.set(b.id,0.001));
  const own=S.buildings.filter(b=>b.type==='own').length;$('presTitle').textContent=own?t('pres_t',cityName(S.city),own):'';shadowDirty=true;
}
function endPres(){if(!PRES)return;const s=PRES.save;cam.t=s.t;cam.dist=s.dist;cam.yaw=s.yaw;cam.pitch=s.pitch;S.minutes=s.min;timeR.value=S.minutes;groupsScale.clear();
  PRES=null;document.body.classList.remove('present');$('presTitle').style.opacity=0;updateSun();try{stopRec();}catch(_){}}
function presFrame(now){
  const tt=(now-PRES.t0)/1000,r=PRES.r;let i=0;
  S.buildings.slice().sort((a,b)=>(a.type==='own')-(b.type==='own')).forEach(b=>{const k=Math.max(0,Math.min(1,(tt-1.2-i*0.22)/1.4));groupsScale.set(b.id,Math.max(0.001,1-Math.pow(1-k,3)));i++;});
  const fly=Math.min(1,tt/3.5),e=1-Math.pow(1-fly,3);cam.t=[PRES.c[0],r*0.12*e,PRES.c[2]];cam.yaw=PRES.start+tt*0.26;cam.dist=r*(5.2-2.6*e)/Math.min(1,W/H);cam.pitch=1.35-0.8*e;
  S.minutes=Math.round(450+Math.min(1,tt/22)*690);timeR.value=S.minutes;SUN=sunAt(S.minutes);$('tlabel').textContent=fmt(S.minutes);shadowDirty=true;
  $('presTitle').style.opacity=(tt>4.5&&tt<9.5)?1:0;if(tt>24)endPres();
}

function applyAI(d,iw,ih,rows){

  else if(d.imageWidthMeters>0){mpp=d.imageWidthMeters/iw;src=t('ai_src4');cal=false;}

    if(row){used.add(rows.indexOf(row));matched++;type='own';if(parseInt(row.f))floors=parseInt(row.f);if(parseInt(row.u))units=parseInt(row.u);note=row.t||'';name=row.n;}

    const o={type,name,x:Math.round(cx*10)/10,z:Math.round(cz*10)/10,w:Math.round(w*10)/10,d:Math.round(dd*10)/10,rot:Math.round(rot*10)/10,floors:Math.min(100,floors),fh:3};

    let dy=b.yaw-a.yaw;while(dy>Math.PI)dy-=2*Math.PI;while(dy<-Math.PI)dy+=2*Math.PI;
    cam.t=[a.t[0]+(b.t[0]-a.t[0])*e,a.t[1]+(b.t[1]-a.t[1])*e,a.t[2]+(b.t[2]-a.t[2])*e];cam.dist=a.dist+(b.dist-a.dist)*e;cam.yaw=a.yaw+dy*e;cam.pitch=a.pitch+(b.pitch-a.pitch)*e;

function polyToParts(pts){if(!pts||pts.length<4)return null;

    for(let j=0;j<P.length;j++){const a=P[j],c=P[(j+1)%P.length];if((a[0]<xm)!==(c[0]<xm))zs.push(a[1]+(xm-a[0])/(c[0]-a[0])*(c[1]-a[1]));}
    zs.sort((a,b)=>a-b);for(let k=0;k+1<zs.length;k+=2)if(zs[k+1]-zs[k]>0.6)rects.push({x0:xs[i],x1:xs[i+1],z0:zs[k],z1:zs[k+1]});}

  return out.length>14?null:out;}

/* CSV 导入（一行一宗也行） */
function parseCSV(s){const out=[];let row=[],f='',q=false;s=s.replace(/^﻿/,'');const sep=(s.split('\n')[0].match(/;/g)||[]).length>(s.split('\n')[0].match(/,/g)||[]).length?';':(s.split('\n')[0].includes('\t')?'\t':',');
  for(let i=0;i<s.length;i++){const c=s[i];if(q){if(c==='"'){if(s[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}else if(c==='"')q=true;else if(c===sep){row.push(f);f='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&s[i+1]==='\n')i++;row.push(f);f='';if(row.some(x=>x.trim()))out.push(row);row=[];}else f+=c;}
  row.push(f);if(row.some(x=>x.trim()))out.push(row);return out;}
async function txImportCSV(f){let txt='';try{txt=await f.text();}catch(e){}if(/^PK/.test(txt)){toast(t('tx_csv_bad')+' · '+t('tx_csv_h'));return;}
  const a=parseCSV(txt);if(a.length<2){toast(t('tx_csv_bad'));return;}const H=a[0].map(h=>h.toLowerCase().trim());
  const col=re=>H.findIndex(h=>re.test(h));const cN=col(/name|project|scheme|skim|building|taman|nama|项目/),cT=col(/type|jenis|category|类型/),cP=col(/price|harga|consideration|价/),cS=col(/psf|per sq/),cD=col(/date|tarikh|year|tahun|month|日期/),cA=col(/mukim|district|daerah|town|location|area name|地区/),cC=col(/count|transactions|bil|宗/),cZ=col(/size|sqft|sq ft|luas|built|land area|floor area/);
  if(cN<0||cP<0){toast(t('tx_csv_bad'));return;}const g=new Map();let deals=0;
  for(const r of a.slice(1)){const name=(r[cN]||'').trim();const price=num(r[cP]);if(!name||!price)continue;deals++;const type=txType(cT>=0?r[cT]:'');const k=name.toLowerCase()+'|'+type;
    let psf=cS>=0?num(r[cS]):0;if(!psf&&cZ>=0){let z=num(r[cZ]);if(z>0){if(z<200)z*=10.764;psf=price/z;}}
    if(!g.has(k))g.set(k,{name,type,area:cA>=0?(r[cA]||'').trim():'',p:[],s:[],n:0,d:''});const o=g.get(k);o.p.push(price);o.s.push(psf);o.n+=cC>=0?Math.max(1,num(r[cC])):1;const dd=cD>=0?(r[cD]||'').trim():'';if(dd>o.d)o.d=dd;}
  const rows=[...g.values()].map(o=>txNew({name:o.name,type:o.type,area:o.area,price:med(o.p),psf:med(o.s),n:o.n,date:o.d}));
  if(!rows.length){toast(t('tx_csv_bad'));return;}if(rows.length<=40){txReview(rows,null);toast(t('tx_csv_ok',deals,rows.length));return;}
  txMerge(rows);toast(t('tx_csv_ok',deals,rows.length));renderPanel();}

function facAtlas(){const T=128,K=Object.keys(FAC),c=document.createElement('canvas');c.width=T*K.length;c.height=T;const g=c.getContext('2d');

      g.strokeStyle='#7dd3fc';g.lineWidth=1.5;for(let j=0;j<10;j++){g.beginPath();const yy=14+((j*37)%100);g.moveTo(x+14+(j*23)%80,yy);g.quadraticCurveTo(x+24+(j*23)%80,yy-4,x+34+(j*23)%80,yy);g.stroke();}}

    if(k==='garden'){for(let j=0;j<160;j++){g.fillStyle=['#4d7c0f','#65a30d','#84cc16','#3f6212'][j%4];g.fillRect(x+(j*53)%T,(j*29+(j>>3)*7)%T,4,4);}for(let j=0;j<18;j++){g.fillStyle=['#f472b6','#facc15','#fb7185','#ffffff'][j%4];g.beginPath();g.arc(x+(j*41+9)%T,(j*67+13)%T,3,0,7);g.fill();}}

    if(k==='fountain'){g.fillStyle='#d6d3d1';g.fillRect(x,0,T,T);g.fillStyle='#e7e5e4';g.beginPath();g.arc(x+T/2,T/2,T*0.48,0,7);g.fill();g.fillStyle='#38bdf8';g.beginPath();g.arc(x+T/2,T/2,T*0.4,0,7);g.fill();g.strokeStyle='#e0f2fe';g.lineWidth=2;for(let j=1;j<4;j++){g.beginPath();g.arc(x+T/2,T/2,T*0.1*j,0,7);g.stroke();}}
    if(k==='bbq'){g.fillStyle='#78716c';g.fillRect(x,0,T,T);g.fillStyle='#57534e';for(let j=0;j<T;j+=12)g.fillRect(x,j,T,2);g.fillStyle='#dc2626';g.fillRect(x+50,50,28,28);}

function slCorners(s){const r=rad(s.rot||0);return [[-1,-1],[1,-1],[1,1],[-1,1]].map(([a,b])=>{const p=rotY(a*s.w/2,b*s.d/2,r);return [s.x+p[0],s.z+p[1]];});}

  const nm=curProj().name;g.font=`700 ${fs}px -apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif`;g.textAlign='left';g.textBaseline='bottom';g.lineWidth=fs*0.3;g.strokeStyle='#0008';
  const tl='Prop 3D · '+nm+'   ☀ '+fmt(S.minutes);g.strokeText(tl,fs,Hc-fs*0.8);g.fillStyle='#fff';g.fillText(tl,fs,Hc-fs*0.8);

function startRec(){const mime=recMime();const c0=document.createElement('canvas');if(!mime||!c0.captureStream){toast(t('rc_no'));return;}
  if(PRES)endPres();const drv=DRIVE&&DRIVE.n,dsv=DRIVE&&DRIVE.save;if(DRIVE)endDrive(true);const L=1280,sc=L/Math.max(W,H);const c=document.createElement('canvas');c.width=Math.round(W*sc/2)*2;c.height=Math.round(H*sc/2)*2;const g=c.getContext('2d');
  const st=c.captureStream(30);let mr;try{mr=new MediaRecorder(st,{mimeType:mime,videoBitsPerSecond:6e6});}catch(e){try{mr=new MediaRecorder(st);}catch(e2){toast(t('rc_no'));return;}}
  const chunks=[];mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  mr.onstop=()=>{const type=(mr.mimeType||mime).split(';')[0];const blob=new Blob(chunks,{type});const ext=type.includes('mp4')?'mp4':'webm';showRec(blob,ext,(performance.now()-REC0)/1000);};
  REC={mr,c,g,raf:0};const REC0=performance.now();document.body.classList.add('recording');if(drv){startDrive(drv,true);if(dsv)DRIVE.save=dsv;}else startPres();mr.start(500);REC.raf=requestAnimationFrame(recFrame);}

function showRec(blob,ext,secs){const name=(curProj().name||'Prop3D').replace(/[\\/:*?"<>|]+/g,'')+'-Prop3D.'+ext;const url=URL.createObjectURL(blob);let m=$('recM');if(!m){m=document.createElement('div');m.className='modal';m.id='recM';document.body.appendChild(m);}
  m.innerHTML=`<div class="card" style="max-width:520px"><h2>${t('rc_ready')}</h2><video src="${url}" controls playsinline style="width:100%;max-height:50vh;border-radius:12px;background:#000"></video>
   <p class="hint">${t('rc_size',(blob.size/1048576).toFixed(1),Math.round(secs))}</p><div class="btns"><a class="btnlike pri" style="text-decoration:none" id="recDl" href="${url}" download="${esc(name)}">${t('rc_dl')}</a><button id="recSh">${t('rc_share')}</button><button id="recX">${t('rc_close')}</button></div><p class="hint">${t('rc_h')}</p></div>`;
  m.classList.add('show');m.style.zIndex=85;$('recX').onclick=()=>{m.classList.remove('show');};
  $('recDl').onclick=async ev=>{if(window.claude&&window.claude.use)ev.preventDefault();let dl=null;try{dl=window.claude&&window.claude.use?await Promise.race([window.claude.use('downloads'),new Promise(r=>setTimeout(()=>r(null),1500))]):null;}catch(e){dl=null;}
    if(dl){try{await dl.save({filename:name,data:blob});}catch(e){toast(t('rc_h'));}}else if(window.claude&&window.claude.use){toast(t('rc_h'));}};
  $('recSh').onclick=async()=>{try{const f=new File([blob],name,{type:blob.type});if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:name});else $('recDl').click();}catch(e){}};}

let projPT=null;function projPush(){if(!CL.db)return;clearTimeout(projPT);projPT=setTimeout(async()=>{try{await projRef().set({list:PROJ.filter(p=>!p.del),dels:PROJ.filter(p=>p.del).map(p=>p.id),upd:Date.now()});}catch(e){}},800);}
function projMerge(d){if(!d||!Array.isArray(d.list))return;const dels=new Set(d.dels||[]);let ch=false;
  d.list.forEach(r=>{const l=PROJ.find(p=>p.id===r.id);if(!l){PROJ.push({id:r.id,name:r.name,upd:r.upd||0,cloud:true});ch=true;}else if((r.upd||0)>(l.upd||0)&&r.name!==l.name){l.name=r.name;l.upd=r.upd;ch=true;}});
  PROJ=PROJ.filter(p=>!(dels.has(p.id)&&p.id!==CUR));if(ch)projSave(false);if(panelMode==='proj')renderPanel();}
async function projSyncInit(){try{const s=await projRef().get();if(exists(s))projMerge(s.data());projPush();}catch(e){}
  try{projRef().onSnapshot(sn=>{if(exists(sn))projMerge(sn.data());},()=>{});}catch(e){}}
async function clAttach(first){if(!CL.db)return;try{if(CL.unsub)CL.unsub();}catch(e){}CL.unsub=null;
  try{const s=await Promise.race([mainRef().get(),new Promise((_,rj)=>setTimeout(()=>rj({code:'timeout'}),10000))]);

/* ---- 马来西亚时间 / 太阳 / 季风 ---- */
function mytNow(){const d=new Date(Date.now()+8*3600e3);const y=d.getUTCFullYear(),m=d.getUTCMonth()+1,dd=d.getUTCDate();
  const doy=Math.round((Date.UTC(y,m-1,dd)-Date.UTC(y,0,0))/864e5);return {y,m,d:dd,doy,h:d.getUTCHours()+d.getUTCMinutes()/60,ms:Date.UTC(y,m-1,dd)};}
function spSun(n){const lat=(S.lat||3.14)*Math.PI/180,lon=S.lon||101.69;const dec=23.44*Math.PI/180*Math.sin(2*Math.PI*(284+n.doy)/365);
  const solar=n.h+(4*(lon-120))/60;const H=(solar-12)*15*Math.PI/180;
  const alt=Math.asin(Math.sin(lat)*Math.sin(dec)+Math.cos(lat)*Math.cos(dec)*Math.cos(H))*180/Math.PI;return {alt,solar};}
function monsoon(m){return (m>=11||m<=3)?'ne':(m>=6&&m<=9)?'sw':'tr';}
function phase(alt,solar){return alt<-6?'night':alt<8?(solar<12?'dawn':'dusk'):'day';}
function autoWx(n,alt){const seed=(n.y*400+n.doy)*8+Math.floor(n.h/3);const r=((Math.sin(seed*12.9898)*43758.5453)%1+1)%1;
  const ms=monsoon(n.m),aft=n.h>=14&&n.h<20,early=n.h>=4&&n.h<9;
  if(ms==='tr'){if(aft)return r<.6?'storm':r<.85?'cloud':'sun';return r<.35?'cloud':'sun';}
  if(ms==='ne'){if(aft)return r<.45?'storm':r<.75?'cloud':'sun';return r<.25?'rain':r<.6?'cloud':'sun';}
  if(early&&r<.3)return 'storm';if(r<.3)return 'haze';if(aft&&r<.55)return 'storm';return r<.75?'cloud':'sun';}

/* ---- 节日日期（官方公共假期；2028 为估算）---- */
const FEST_D={2026:{cny:'02-17',raya:'03-21',wesak:'05-31',deepa:'11-08'},2027:{cny:'02-06',raya:'03-10',wesak:'05-20',deepa:'10-28'},2028:{cny:'01-26',raya:'02-26',wesak:'05-09',deepa:'10-17'}};
const FEST_W={cny:[-10,15],raya:[-7,30],wesak:[-5,3],deepa:[-7,5],xmas:[-24,6]};
function festList(){const out=[];for(const y in FEST_D){for(const k in FEST_D[y]){const [mm,dd]=FEST_D[y][k].split('-').map(Number);out.push({k,ms:Date.UTC(+y,mm-1,dd),y:+y});}}
  for(let y=2026;y<=2030;y++)out.push({k:'xmas',ms:Date.UTC(y,11,25),y});return out.sort((a,b)=>a.ms-b.ms);}
function festAuto(n){for(const f of festList()){const dd=(n.ms-f.ms)/864e5,w=FEST_W[f.k];if(dd>=w[0]&&dd<=w[1])return f.k;}return null;}
function festNext(n){const f=festList().find(f=>f.ms>=n.ms);if(!f)return '';const d=new Date(f.ms);return t('f_'+f.k)+' '+d.getUTCDate()+'/'+(d.getUTCMonth()+1)+'/'+d.getUTCFullYear();}
function curScene(){const n=mytNow(),sn=spSun(n);let wx=P.wx?(P.wxPick==='auto'?autoWx(n,sn.alt):P.wxPick):null;
  let fest=P.fest?(P.festPick==='auto'?festAuto(n):P.festPick==='none'?null:P.festPick):null;return {n,sn,ph:phase(sn.alt,sn.solar),wx,fest,ms:monsoon(n.m)};}

    const gr=spX.createLinearGradient(0,H*.75,0,H);gr.addColorStop(0,'#2a4a7a00');gr.addColorStop(1,'#2a4a7a88');spX.fillStyle=gr;spX.fillRect(0,H*.75,W,H*.25);
    for(const p of spParts)if(p.tp==='lo'){p.y-=p.v*dt;p.x+=Math.sin(T*.6+p.p)*8*dt;if(p.y<-80){p.y=H+60;p.x=rnd(0,W);}lotus(p.x,p.y,p.s,T,p.p);}}

    const cs=['#ff4d4d','#ffd84d','#4dff88','#4dc3ff','#ff8cd9'];spX.strokeStyle='#2b3b2b';spX.lineWidth=1.5;for(let row=0;row<2;row++){const y0=18+row*26;spX.beginPath();for(let x=0;x<=W;x+=8){const y=y0+Math.sin(x/W*Math.PI*4+row)*14+14;x?spX.lineTo(x,y):spX.moveTo(x,y);}spX.stroke();
      for(let i=0,x=20;x<W;x+=46,i++){const y=y0+Math.sin(x/W*Math.PI*4+row)*14+18;spX.save();spX.globalAlpha=.45+.55*Math.abs(Math.sin(T*2.4+i*.9+row));spX.shadowColor=cs[i%5];spX.shadowBlur=14;spX.fillStyle=cs[(i+row)%5];spX.beginPath();spX.ellipse(x,y,4.5,7,0,0,7);spX.fill();spX.restore();}}
    tree(W*.12,H-18,W<600?.7:1,T);}

    else if(p.tp==='sp'){p.y-=p.v*dt;if(p.y<-5){p.y=H+5;p.x=rnd(0,W);}spX.fillStyle=f==='raya'?'#fff2b0':'#ffd34d';spX.globalAlpha=.3+.6*Math.abs(Math.sin(T*2+p.p));spX.beginPath();spX.arc(p.x,p.y,p.r,0,7);spX.fill();}}spX.globalAlpha=1;
  for(let i=spFw.length-1;i>=0;i--){const q=spFw[i];q.vy+=90*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt*.8;if(q.l<=0){spFw.splice(i,1);continue;}spX.globalAlpha=q.l;spX.fillStyle=q.c;spX.beginPath();spX.arc(q.x,q.y,2.2,0,7);spX.fill();}spX.globalAlpha=1;

    for(const p of spParts)if(p.tp==='r'){p.y+=p.v*dt;p.x-=p.v*.18*dt;if(p.y>H){p.y=rnd(-60,-10);p.x=rnd(0,W+150);}spX.moveTo(p.x,p.y);spX.lineTo(p.x+p.l*.18,p.y-p.l);}spX.stroke();}

function hstr(x){let h=2166136261;for(let i=0;i<x.length;i++){h^=x.charCodeAt(i);h=Math.imul(h,16777619);}return x.length+'.'+(h>>>0).toString(36);}
let clRev=0,clLast='',clImgSig='',clMtime=0,clMH='';try{localStorage.removeItem('prop3d-last');clLoadMeta();}catch(e){}
function clLoadMeta(){try{clRev=+(localStorage.getItem(PK('prop3d-rev'))||0);clLast=localStorage.getItem(PK('prop3d-lasth'))||'';clImgSig=localStorage.getItem(PK('prop3d-imgsig'))||'';clMtime=+(localStorage.getItem(PK('prop3d-mtime'))||0);clMH=localStorage.getItem(PK('prop3d-mh'))||'';}catch(e){clRev=0;clLast='';clImgSig='';clMtime=0;clMH='';}}
function clStore(){try{localStorage.setItem(PK('prop3d-rev'),String(clRev));localStorage.setItem(PK('prop3d-lasth'),clLast);localStorage.setItem(PK('prop3d-imgsig'),clImgSig);localStorage.setItem(PK('prop3d-mtime'),String(clMtime));localStorage.setItem(PK('prop3d-mh'),clMH);}catch(e){}}
function touchM(){const h=hstr(payload())+'|'+imgSig(IMG);if(!clMH){clMH=h;clStore();return;}if(h!==clMH){clMH=h;clMtime=Date.now();clStore();}}
function payload(){const o=Object.assign({},S);delete o.minutes;return JSON.stringify(o);}
function imgSig(s){if(!s)return '';let h=0;for(let i=0;i<s.length;i+=97)h=(h*31+s.charCodeAt(i))|0;return s.length+':'+h;}
function isDirty(){return hstr(payload())!==clLast||imgSig(IMG)!==clImgSig;}
function fmtT(ms){const d=new Date(ms+8*3600e3);return String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0')+' '+String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0');}
function clStatusText(){return CL.st==='ok'?t('cl_ok',fmtT(CL.at||clRev||Date.now())):CL.st==='err'?t('cl_err',CL.err):t('cl_'+CL.st);}
function clSet(st,err){CL.st=st;if(err!==undefined)CL.err=err;spClText();const el=$('ppClSt');if(el)el.textContent='☁ '+clStatusText();}
const mainRef=()=>CL.db.doc('data/users/'+CL.uid+'/'+(CUR==='main'?'main':CUR)),imgRef=()=>CL.db.doc('data/users/'+CL.uid+'/'+(CUR==='main'?'img':CUR+'_img')),projRef=()=>CL.db.doc('data/users/'+CL.uid+'/projects');

function shrinkImg(src){return new Promise(res=>{if(!src)return res('');const im=new Image();im.onload=()=>{let mx=1600,q=.72,out='';for(let k=0;k<8;k++){const sc=Math.min(1,mx/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);out=c.toDataURL('image/jpeg',q);if(out.length<235000)return res(out);mx*=.8;q=Math.max(.45,q-.06);}res(null);};im.onerror=()=>res(null);im.src=src;});}
async function clUpload(manual){if(!CL.db)return;if(CL.busy){CL.again=true;return;}CL.busy=true;clSet('saving');
  try{const rev=Date.now(),pl=payload(),sig=imgSig(IMG);
    if(sig!==clImgSig){const small=await shrinkImg(IMG);if(small===null){toast(t('cl_img_big'));await imgRef().set({rev,img:''});}else await imgRef().set({rev,img:small});}
    await mainRef().set({v:1,rev,mt:clMtime||rev,dev:DEV,s:pl,imgSig:sig});clRev=rev;clLast=hstr(pl);clImgSig=sig;clMH=clLast+'|'+sig;clStore();CL.at=rev;clSet('ok');if(manual)toast(t('cl_up_ok'));}
  catch(e){clSet('err',(e&&(e.code||e.message))||'error');}

async function applyRemote(d,withImg){let o;try{o=JSON.parse(d.s);}catch(e){return;}const keepMin=S.minutes;

  clLast=hstr(payload());clImgSig=imgSig(IMG);clMH=clLast+'|'+clImgSig;clStore();CL.at=d.rev;clSet('ok');if(spOn){spText();}}
async function clDownload(manual){if(!CL.db)return;try{const s=await mainRef().get();if(!exists(s)){toast(t('cl_empty'));clSet('empty');return;}await applyRemote(s.data(),true);if(manual)toast(t('cl_got'));}catch(e){clSet('err',(e&&(e.code||e.message))||'error');}}
function decide(d,first){/* 不再弹窗：内容一样就跳过；这台没有改动就用云端；两边都改了，较新的赢 */
  if(d.s===payload()){clRev=d.rev;clLast=hstr(d.s);clStore();CL.at=d.rev;clSet('ok');return;}
  if(!isDirty()||S.isDemo||(first&&!clRev&&!S.buildings.length&&!IMG)){applyRemote(d,first).then(()=>{if(!first||clRev)toast(t('cl_got'));});return;}
  if(clMtime>(d.mt||d.rev)){clRev=Math.max(clRev,d.rev);clStore();clSchedule();return;}
  applyRemote(d,true).then(()=>toast(t('cl_got')));}
function onRemote(d){if(!d||!d.rev||d.rev<=clRev)return;if(d.dev===DEV&&hstr(d.s)===clLast){clRev=d.rev;clStore();return;}decide(d,false);}
